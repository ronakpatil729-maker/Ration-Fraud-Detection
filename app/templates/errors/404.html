{% extends "base.html" %}

{% block title %}404 - Resource Not Found{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-5 shadow-sm border-0">
                <div class="mb-3">
                    <span class="d-inline-flex align-items-center justify-content-center bg-warning-subtle text-warning rounded-circle p-4">
                        <i class="bi bi-search fs-1"></i>
                    </span>
                </div>
                <h2 class="fw-bold text-dark mb-2">404 - Page Not Found</h2>
                <p class="text-muted mb-4">
                    The requested page, transaction record, or vigilance resource could not be found.
                </p>
                <div>
                    <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4 rounded-pill">
                        <i class="bi bi-house-door me-1"></i> Go to Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
