{% extends "base.html" %}

{% block title %}403 Forbidden - Access Denied{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-5 shadow-sm border-0">
                <div class="mb-3">
                    <span class="d-inline-flex align-items-center justify-content-center bg-danger-subtle text-danger rounded-circle p-4">
                        <i class="bi bi-shield-x fs-1"></i>
                    </span>
                </div>
                <h2 class="fw-bold text-dark mb-2">403 - Access Denied</h2>
                <p class="text-muted mb-4">
                    You do not have the required role privileges or permissions to access this vigilance operations resource.
                </p>
                <div>
                    <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4 rounded-pill">
                        <i class="bi bi-arrow-left me-1"></i> Return to Safety
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
